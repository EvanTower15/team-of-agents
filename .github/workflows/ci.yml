name: Recovery Team MAS CI Pipeline

on:
  push:
    branches: [ main, Rough-Draft-of-Rest-of-Project ]
  pull_request:
    branches: [ main, Rough-Draft-of-Rest-of-Project ]
  # Lets the live suite (below) be triggered by hand from the Actions tab.
  workflow_dispatch:
    inputs:
      run_live:
        description: "Also run the live Groq integration suite (spends daily tokens)"
        type: boolean
        default: false

jobs:
  lint:
    name: Code Quality & Syntax Lint Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint Code with Flake8
      run: |
        # stop the build if there are Python syntax errors or undefined symbols
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. Max line length 127
        flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    name: Pytest Suite (offline)
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    # Deliberately excludes the `live` marker (see pytest.ini). Those tests need
    # a real GROQ_API_KEY *and* built Chroma collections; this runner has
    # neither, so before this split they failed on every push and one of them
    # passed for the wrong reason -- it matched "surgeon" inside the fallback
    # answer's "python -m src.ingest --agent surgeon".
    - name: Run Offline Pytest Suite
      run: |
        pytest tests/ -v -m "not live"

  live:
    name: Live integration suite (Groq + built indexes)
    runs-on: ubuntu-latest
    needs: lint
    # Never on push/PR: this spends the free-tier daily token budget and its
    # assertions depend on LLM phrasing. Run it on purpose from the Actions tab.
    if: github.event_name == 'workflow_dispatch' && inputs.run_live

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Fail early if no key is configured
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        if [ -z "$GROQ_API_KEY" ]; then
          echo "::error::GROQ_API_KEY secret is not set, so every live test would"
          echo "::error::fall back and fail. Add it under Settings > Secrets > Actions."
          exit 1
        fi

    # chroma_db/ is gitignored, so the collections must be built here or every
    # specialist retrieval raises FileNotFoundError and the graph falls back.
    # Embeddings are local (no API cost); this is CPU time, not tokens.
    - name: Build the four knowledge bases
      run: |
        for agent in pt trainer surgeon nutrition; do
          python -m src.ingest --agent "$agent"
        done

    - name: Run Live Pytest Suite
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        pytest tests/ -v -m live
