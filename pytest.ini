[pytest]
testpaths = tests
# Quieter default: full tracebacks on these tests print whole synthesized
# answers, which buries the assertion that actually failed.
addopts = -ra --tb=short

markers =
    live: needs a real GROQ_API_KEY *and* built Chroma collections. Excluded from
        the push/PR CI job (`-m "not live"`) for two reasons: the free-tier daily
        token cap has been exhausted repeatedly by test runs, and LLM phrasing
        varies between runs, so these fail for reasons unrelated to the commit
        under test. Run them deliberately -- locally, or via the manual/nightly
        "Live integration suite" workflow job -- not on every push.
