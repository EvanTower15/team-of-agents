<svg width="100%" viewBox="0 0 1000 1150" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Recovery Team RAG architecture</title>
<desc>Layered architecture. The Streamlit UI accepts a question and an optional photo, which a Gemini vision call converts to a text description first. Inside the LangGraph orchestrator, a follow-up is resolved against prior turns into a standalone question; a router checks a RED_FLAG regex before any model call and otherwise classifies with a small LM; a planner (small LM) then chooses which specialists run and in what order, capped at four. One consult_next node loops over that plan -- the sequence is data, not graph topology -- and each specialist receives every upstream draft plus its structured constraints as binding peer_context. Specialists may call deterministic calculators, re-query their own Chroma collection, or (only when their own retrieval returned nothing) search PubMed. A bounded back-channel lets one specialist put a question to another. Synthesis merges the drafts into one attributed answer, and a compliance check re-verifies that answer against every extracted constraint before it reaches the patient.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowboth" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g style="font-family:'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">

<!-- ── Streamlit UI + vision side-branch ─────────────────────────────────── -->
