<text x="388" y="1002" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153,60,29);font-size:11px">40 docs · ~203 chunks</text>

<rect x="512" y="964" width="212" height="58" rx="8" style="fill:rgb(255,250,248);stroke:rgb(153,60,29);stroke-width:0.5px"/>
<text x="618" y="984" text-anchor="middle" dominant-baseline="central" style="fill:rgb(113,43,19);font-size:13px;font-weight:500">Chroma: trainer_docs</text>
<text x="618" y="1002" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153,60,29);font-size:11px">22 docs · 536 chunks</text>

<rect x="742" y="964" width="212" height="58" rx="8" style="fill:rgb(255,250,248);stroke:rgb(153,60,29);stroke-width:0.5px"/>
<text x="848" y="984" text-anchor="middle" dominant-baseline="central" style="fill:rgb(113,43,19);font-size:13px;font-weight:500">Chroma: nutrition_kb</text>
<text x="848" y="1002" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153,60,29);font-size:11px">10 docs · 179 chunks</text>

<text x="500" y="1052" text-anchor="middle" style="fill:rgb(82,81,78);font-size:11px">One ./chroma_db dir · one collection per agent — knowledge siloing is PHYSICAL, not a prompt instruction (D3)</text>
<text x="500" y="1071" text-anchor="middle" style="fill:rgb(82,81,78);font-size:11px">Ingest: data/&lt;agent&gt;/ → chunk 1000/150 → embed locally → persist · no API key, no rate limits, works offline</text>
<text x="500" y="1096" text-anchor="middle" style="fill:rgb(82,81,78);font-size:10px">Specialists + synthesis on Groq gpt-oss-120b · router, planner, compliance on gpt-oss-20b · vision on Gemini Flash (D27)</text>

</g>
